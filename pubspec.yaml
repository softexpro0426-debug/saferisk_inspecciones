name: saferisk_inspecciones
description: "Gestión de estados de inspecciones SafeRisk."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.3.2
  dio: ^5.11.0
  crypto: ^3.0.7
  go_router: ^17.5.0
  flutter_secure_storage: ^11.0.0
  local_auth: ^3.0.2
  local_auth_android: ^2.0.0
  local_auth_darwin: ^2.0.0
  connectivity_plus: ^7.3.1
  geolocator: ^14.0.3
  package_info_plus: ^10.2.1
  google_maps_flutter: ^2.18.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4


flutter_native_splash:
  color: "#042355"
  color_dark: "#042355"

  image: assets/splash/saferisk_logo.png
  image_dark: assets/splash/saferisk_logo.png

  android: true
  ios: true
  web: false

  android_12:
    color: "#042355"
    color_dark: "#042355"
    image: assets/splash/saferisk_logo.png
    image_dark: assets/splash/saferisk_logo.png

  fullscreen: true

flutter:
  uses-material-design: true

  assets:
    - config/local.json
    - assets/branding/
    - assets/splash/

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/icons/app_icon.png"

  adaptive_icon_background: "#042355"
  adaptive_icon_foreground: "assets/icons/app_icon.png"

  remove_alpha_ios: true
